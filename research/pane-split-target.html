// ═══════════════════════════════════════════════════════════════════════════
//  CORE LOGIC — prototype of selectSplitTarget(parentPaneId)
// ═══════════════════════════════════════════════════════════════════════════

/**
 * WezTerm pane shape returned by `wezterm cli list --format json`.
 */
interface PaneJSON {
  window_id: number;
  tab_id: number;
  pane_id: string;   // numeric, e.g. "7"
  workspace: string;
  size: { rows: number; cols: number; pixel_width: number; pixel_height: number; dpi: number };
  title: string;
  cwd: string;
  cursor_x: number;
  cursor_y: number;
  cursor_shape: string;
  cursor_visibility: string;
  left_col: number;
  top_row: number;
  tab_title: string;
  window_title: string;
  is_active: boolean;
  is_zoomed: boolean;
  tty_name: string | null;
}

interface SplitDecision {
  targetPaneId: string;
  direction: "--right" | "--bottom";
  reason: string;
  considered: {
    totalPanesInTab: number;
    candidates: Array<{ paneId: string; rows: number; cols: number; area: number }>;
    winnerArea: number;
  };
}

/**
 * Find the optimal pane to split, targeting the largest pane in the
 * parent's tab.  Alternates split direction based on the winning pane's
 * aspect ratio (cols / rows):
 *
 *   - cols >= rows  →  --right   (adds width, relieves wide layout)
 *   - cols <  rows  →  --bottom  (adds height, relieves tall layout)
 *
 * Tie-breaking: first-found in list order (wezterm cli list returns panes
 * in stable Z-order).
 *
 * Returns a SplitDecision; never throws (caller handles empty/null inputs).
 */
function selectSplitTarget(
  panes: PaneJSON[],
  parentPaneId: string,
): SplitDecision | null {
  if (!panes || panes.length === 0) {
    return null;
  }

  const parent = panes.find(p => p.paneId === parentPaneId);
  if (!parent) {
    return null;
  }

  const tabId = parent.tab_id;
  const sameTab = panes.filter(p => p.tab_id === tabId);

  if (sameTab.length === 0) {
    return null;
  }

  const candidates = sameTab.map(p => ({
    paneId: p.pane_id,
    rows: p.size.rows,
    cols: p.size.cols,
    area: p.size.rows * p.size.cols,
  }));

  const maxArea = Math.max(...candidates.map(c => c.area));
  const winners = candidates.filter(c => c.area === maxArea);
  const winner = winners.find(c => c.paneId === parentPaneId) ?? winners[0];

  const direction: "--right" | "--bottom" =
    winner.cols >= winner.rows ? "--right" : "--bottom";

  return {
    targetPaneId: winner.paneId,
    direction,
    reason: formatReason(winner, direction, sameTab.length, maxArea),
    considered: { totalPanesInTab: sameTab.length, candidates, winnerArea: maxArea },
  };
}

function formatReason(
  winner: { paneId: string; cols: number; rows: number; area: number },
  direction: string,
  panesInTab: number,
  maxArea: number,
): string {
  const ratio = (winner.cols / winner.rows).toFixed(2);
  return `pane ${winner.paneId} is largest in tab (area=${winner.area}, ${winner.cols}×${winner.rows}, ratio=${ratio}) → ${direction}  [${panesInTab} pane(s) in tab, max area=${maxArea}]`;
}

const DEMOS: Record<string, { data: PaneJSON[]; parent: string; label: string }> = {
  "single-pane":     { data: demo1(), parent: "7",  label: "1 · Single pane" },
  "parent-largest":  { data: demo2(), parent: "7",  label: "2 · Parent is largest" },

  "deeply-nested":   { data: demo6(), parent: "3",  label: "6 · Deeply nested, tall winner" },
};

let livePanes: PaneJSON[] = demo2();
let liveParent: string = "7";

const $editor = document.getElementById("json-editor") as HTMLTextAreaElement;
const $parent = document.getElementById("parent-id") as HTMLInputElement;
const $dump   = document.getElementById("state-dump") as HTMLDivElement;

function renderEditor() {
  $editor.value = JSON.stringify(livePanes, null, 2);
  $parent.value = liveParent;
}

function renderState(decision: SplitDecision | null, panes: PaneJSON[], parentId: string): void {
  const parent = panes.find(p => p.pane_id === parentId);
  const tabId  = parent ? parent.tab_id : "?";
  const lines: string[] = [];

  lines.push(`<span class="label">── input ──────────────────────────────</span>`);
  lines.push(`  parentPaneId : ${esc(parentId)}`);
  lines.push(`  parent tab_id: ${tabId}`);
  lines.push(`  panes in tab : ${panes.filter(p => p.tab_id === tabId).length}`);
  lines.push(`  total panes  : ${panes.length}`);
  lines.push("");

  lines.push(`<span class="label">── all panes ───────────────────────────</span>`);
  for (const p of panes) {
    const inTab = p.tab_id === tabId;
    const marker = p.pane_id === parentId ? "<span class='warn'> ◀ parent</span>"
                 : p.pane_id === (decision?.targetPaneId) ? "<span class='success'> ◀ target</span>"
                 : "";
    lines.push(`  ${pad(p.pane_id,4)} tab=${pad(String(p.tab_id),2)}  ${r(p.size.rows)}×${c(p.size.cols)}  area=${pad(String(p.size.rows*p.size.cols),5)}  ${inTab ? "":"<span class='muted'>[other tab]</span>"}${marker}`);
  }
  lines.push("");

  if (!decision) {
    lines.push(`<span class="warn">── decision: null (parent not found or no panes in tab)</span>`);
  } else {
    lines.push(`<span class="success">── decision ──────────────────────────────</span>`);
    lines.push(`  targetPaneId : ${esc(decision.targetPaneId)}`);
    const dirClass = decision.direction === "--right" ? "dir-right" : "dir-bottom";
    lines.push(`  direction    : <span class="${dirClass}">${esc(decision.direction)}</span>`);
    lines.push(`  reason       : ${esc(decision.reason)}`);
    lines.push("");
    lines.push(`<span class="label">── considered.candidates (sorted by area desc) ──</span>`);
    for (const c of [...decision.considered.candidates].sort((a,b) => b.area - a.area)) {
      const w = c.paneId === decision.targetPaneId ? " ◀ winner" : "";
      lines.push(`  ${pad(c.paneId,4)}  ${r(c.rows)}×${c(c.cols)}  area=${pad(String(c.area),5)}${w}`);
    }
    lines.push(`  max area     : ${decision.considered.winnerArea}`);
  }

  $dump.innerHTML = lines.join("\n");

  function esc(s: string) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function pad(s: string, n: number) { return s + " ".repeat(Math.max(0, n - s.length)); }
  function r(n: number) { return String(n).padStart(3); }
  function c(n: number) { return String(n).padStart(3); }
}

function runDecision(): void {
  try {
    const parsed = JSON.parse($editor.value) as PaneJSON[];
    const pid    = $parent.value.trim();
    livePanes = parsed;
    liveParent = pid;
    const d = selectSplitTarget(parsed, pid);
    renderState(d, parsed, pid);
  } catch (e: any) {
    $dump.innerHTML = `<span class="warn">parse error: ${esc(e.message)}</span>`;
  }
}

function loadDemo(key: string): void {
  const d = DEMOS[key];
  livePanes = JSON.parse(JSON.stringify(d.data)); // deep clone
  liveParent = d.parent;
  renderEditor();
  runDecision();
}

// Tab bar
const tabBar = document.getElementById("tab-bar") as HTMLDivElement;
const tabDefs = [
  { id: "freeplay",    label: "▶ free-play" },
  { id: "walkthroughs", label: "? walkthroughs" },
];
tabDefs.forEach((t, i) => {
  const el = document.createElement("div");
  el.className = "tab" + (i === 0 ? " active" : "");
  el.textContent = t.label;
  el.dataset.tab = t.id;
  el.addEventListener("click", () => switchTab(t.id));
  tabBar.appendChild(el);
});

function switchTab(id: string): void {
  document.querySelectorAll(".tab").forEach((el: any) => {
    el.classList.toggle("active", el.dataset.tab === id);
  });
  document.querySelectorAll(".panel").forEach((el: any) => {
    el.classList.toggle("active", el.id === "panel-" + id);
  });
}

const btnRun   = document.getElementById("btn-run");

btnRun!.addEventListener("click", runDecision);
btnReset!.addEventListener("click", () => loadDemo("parent-largest"));

    build: demo2, parent: "7",
    expected: d => d
      ? `target=p7, direction=--right (parent=self, cols≥rows)`
      : "null — unexpected",
  },
  {
    title: "Another pane is largest — target switches",
    desc: "p7 is only 20×84 (area=1680). p19 is 42×168 (area=7056) — " +
          "the clear winner. We split p19 instead of the parent. p19 is wide → --right.",
    build: demo3, parent: "7",
    expected: d => d
      ? `target=p19, direction=--right (winner is wide, not parent)`
      : "null — unexpected",
  },
  {
    title: "Cross-tab guard",
    desc: "p99 lives in tab 9. The parent p7 is in tab 5. Even though p99 " +
          "is far larger, it MUST NOT be selected — it's a different tab.",
    build: demo4, parent: "7",
    expected: d => d
      ? `target=p7, direction=--right (p99 in tab 9 is excluded)`
      : "null — unexpected",
  },
  {
    title: "Square pane — direction tie-break",
    desc: "p2 is 40×40 (cols === rows). cols >= rows is true, so --right " +
          "wins. This documents the convention for square cells.",
    build: demo5, parent: "2",
    expected: d => d
      ? `target=p2, direction=--right (square → >= branch)`
      : "null — unexpected",
  },
  {
    title: "Deeply nested — tall narrow wins",
    desc: "Six panes in tab 2. p3 is 80 rows × 20 cols (area=1600, ratio=0.25) — " +
          "very tall. Winner → --bottom to add height.",
    build: demo6, parent: "3",
    expected: d => d
      ? `target=p3, direction=--bottom (winner is tall, ratio=0.25)`
      : "null — unexpected",
  },
];

const stepsContainer = document.getElementById("steps-container") as HTMLDivElement;
const wtState        = document.getElementById("walkthrough-state") as HTMLDivElement;

function renderStep(stepIdx: number): void {
  const step = steps[stepIdx];
  const panes = step.build();
  const d = selectSplitTarget(panes, step.parent);

  // State dump
  const parent = panes.find(p => p.pane_id === step.parent);
  const tabId  = parent ? parent.tab_id : "?";

  const lines: string[] = [];
  lines.push(`<span class="label">── case ${stepIdx + 1}/${steps.length}: ${step.title} ──</span>`);
  lines.push(`  parentPaneId : ${step.parent}  (tab_id=${tabId})`);
  lines.push("");

  for (const p of panes) {
    const inTab  = p.tab_id === tabId;
    const marker = p.pane_id === step.parent ? "<span class='warn'> ◀ parent</span>"
                 : p.pane_id === (d?.targetPaneId) ? "<span class='success'> ◀ target</span>"
                 : "";
    lines.push(`  ${p.pane_id.padStart(4)} tab=${String(p.tab_id).padStart(2)}  rows=${String(p.size.rows).padStart(3)}  cols=${String(p.size.cols).padStart(3)}  area=${String(p.size.rows*p.size.cols).padStart(5)}  ${inTab ? "":"<span class='muted'>[other tab]</span>"}${marker}`);
  }

  if (!d) {
    lines.push(`\n<span class="warn">result: null</span>`);
  } else {
    lines.push(`\n<span class="success">targetPaneId : ${d.targetPaneId}</span>`);
    const cls = d.direction === "--right" ? "dir-right" : "dir-bottom";
    lines.push(`direction     : <span class="${cls}">${d.direction}</span>`);
    lines.push(`reason        : ${d.reason}`);
    lines.push(`\n<span class="muted">expected: ${step.expected(d)}</span>`);
  }

  wtState.innerHTML = `<div id="state-dump">${lines.join("\n")}</div>`;
  renderPaneGrid(wtState, panes, tabId, step.parent, d?.targetPaneId);
}

function renderPaneGrid(
  container: HTMLElement,
  panes: PaneJSON[],
  tabId: number,
  parentId: string,
  targetId: string | undefined,
): void {
  const sameTab = panes.filter(p => p.tab_id === tabId);
  const maxArea = Math.max(...sameTab.map(p => p.size.rows * p.size.cols));
  const maxCols = Math.max(...sameTab.map(p => p.size.cols));
  const maxRows = Math.max(...sameTab.map(p => p.size.rows));

  const grid = document.createElement("div");
  grid.className = "pane-grid";
  grid.style.gridTemplateColumns = `repeat(${Math.max(maxCols, 1)}, 1fr)`;

  for (const p of sameTab) {
    const cell = document.createElement("div");
    const areaFrac = ((p.size.rows * p.size.cols) / maxArea * 100).toFixed(0);
    cell.className = "pane-cell" +
      (p.pane_id === parentId ? " parent" : "") +
      (p.pane_id === targetId ? " target" : " other");
    cell.style.flex = `${p.size.cols} ${p.size.rows} 0%`;
    cell.style.minWidth  = `${p.size.cols * 8}px`;
    cell.style.minHeight = `${p.size.rows * 14}px`;
    cell.innerHTML =
      `<b>p${p.pane_id}</b><br>` +
      `<span class="muted">${p.size.cols}×${p.size.rows}</span><br>` +
      `<span class="muted">${areaFrac}%</span>`;
    grid.appendChild(cell);
  }

  // Remove old grid if present
  const old = container.querySelector(".pane-grid");
  if (old) old.remove();
  container.insertBefore(grid, container.firstChild);
}

steps.forEach((step, i) => {
  const el = document.createElement("div");
  el.className = "step";
  el.innerHTML =
    `<div class="step-head">` +
    `  <span class="step-title">${i+1}. ${step.title}</span>` +
    `  <span class="step-badge">click to expand</span>` +
    `</div>` +
    `<div class="step-desc">${step.desc}</div>` +
    `<div class="step-body" id="step-body-${i}"></div>`;
  el.addEventListener("click", () => {
    const wasOpen = el.classList.contains("open");
    document.querySelectorAll(".step").forEach(s => s.classList.remove("open"));
    if (!wasOpen) {
      el.classList.add("open");
      const body = document.getElementById(`step-body-${i}`)!;
      // Lazy render
      if (!body.dataset.rendered) {
        const panes = step.build();
        const d = selectSplitTarget(panes, step.parent);
        const parent = panes.find(p => p.pane_id === step.parent);
        const tabId  = parent ? parent.tab_id : "?";

        // Inline mini state dump inside the step
        const dump = document.createElement("div");
        dump.id = "state-dump";
        const lines: string[] = [];
        for (const p of panes) {
          const m = p.pane_id === step.parent ? " ◀ parent"
                  : p.pane_id === d?.targetPaneId ? " ◀ target" : "";
          lines.push(`${p.pane_id.padStart(4)}  ${String(p.size.rows).padStart(3)}×${String(p.size.cols).padStart(3)}  area=${String(p.size.rows*p.size.cols).padStart(5)}${m}`);
        }
        if (d) {
          const cls = d.direction === "--right" ? "dir-right" : "dir-bottom";
          lines.push(`\n→ target: <span class="success">${d.targetPaneId}</span>  direction: <span class="${cls}">${d.direction}</span>`);
        }
        dump.innerHTML = lines.join("\n");
        body.appendChild(dump);

        renderPaneGrid(body, panes, tabId, step.parent, d?.targetPaneId);
        body.dataset.rendered = "1";
      }
    }
  });
  stepsContainer.appendChild(el);
});
